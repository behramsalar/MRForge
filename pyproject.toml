[project]
name = "mrforge"
version = "0.0.0"
description = "Guided, reliable MRI/fMRI analysis on top of FSL"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "sqlalchemy>=2", "typer", "psutil", "pyyaml", "pydicom>=3", "nibabel", "fastapi", "uvicorn", "python-multipart", "sse-starlette"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "types-psutil", "types-PyYAML", "numpy"]

[project.scripts]
mrforge = "mrforge.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "scripts"]
markers = [
    "fsl: integration tests that need a working FSL installation",
    "slow: tests that take many minutes (fsl_anat); run with -m \"fsl and slow\"",
    "realdata: tests that need the real DICOM test session (skipped when it is missing)",
    "bidsvalidator: tests that run the real BIDS validator (skipped when it is not installed)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # the formatter still wraps code; long comment banners and strings are fine

[tool.ruff.lint.isort]
known-first-party = ["mrforge"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["backend", "scripts"]
